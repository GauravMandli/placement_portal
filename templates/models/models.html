<!-- Company Details Modal -->
<div class="modal fade" id="companyDetailsModal" tabindex="-1" aria-labelledby="companyDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="companyDetailsModalLabel">Company Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
        
            <div class="modal-body" id="companyDetailsContent">
                <!-- Company details will be populated here -->
            </div>
            <div class="modal-footer">

                
                    {% if user.role == "placement_cell" %}
<!-- Approve button -->

    <button type="button" class="btn btn-success btn-sm" id="openApproveConfirm">
        <i class="fas fa-check me-1"></i> Approve
    </button>

<!-- Reject button -->

    <button type="button" class="btn btn-danger btn-sm" id="openRejectConfirm">
        <i class="fas fa-times me-1"></i> Reject
    </button>

        {% endif %}

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
